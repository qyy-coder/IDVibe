<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI一照成证</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1a1a2e;--card:#16213e;--card2:#0f3460;--accent:#e94560;
  --text:#eaeaea;--text2:#a0a0b0;--border:#2a2a4a;--radius:14px
}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.bg-particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.bg-particles span{position:absolute;border-radius:50%;opacity:.05;animation:float 20s infinite}
.bg-particles span:nth-child(1){width:300px;height:300px;background:radial-gradient(circle,#e94560,transparent);top:10%;left:5%}
.bg-particles span:nth-child(2){width:200px;height:200px;background:radial-gradient(circle,#533483,transparent);top:60%;left:70%;animation-delay:-7s}
.bg-particles span:nth-child(3){width:250px;height:250px;background:radial-gradient(circle,#0f3460,transparent);top:30%;left:40%;animation-delay:-14s}
@keyframes float{0%,100%{transform:translateY(0)scale(1)}50%{transform:translateY(-30px)scale(1.1)}}

.header{position:relative;z-index:1;text-align:center;padding:40px 20px 30px;background:linear-gradient(180deg,rgba(233,69,96,.1),transparent)}
.header h1{font-size:36px;font-weight:800;letter-spacing:4px;background:linear-gradient(135deg,#e94560,#ff6b6b,#e94560);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.header p{font-size:14px;color:var(--text2)}

.container{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 20px 40px}
.control-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:800px){.control-row{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .3s}
.card:hover{border-color:rgba(233,69,96,.3)}
.card-title{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:4px;height:16px;background:var(--accent);border-radius:2px}

.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;transition:all .3s;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.01);max-height:200px;overflow:hidden}
.upload-zone:hover{border-color:var(--accent);background:rgba(233,69,96,.05)}
.upload-zone.has{border-style:solid;padding:8px;max-height:200px}
.upload-zone.has img{height:180px;width:auto;max-width:100%;display:block;border-radius:8px;object-fit:contain;margin:0 auto}
.upload-icon{font-size:30px;opacity:.3;margin-bottom:2px}
.upload-text{font-size:12px;color:var(--text2)}

select{width:100%;padding:10px 14px;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:14px;cursor:pointer;outline:none}
select:focus{border-color:var(--accent)}

.dot-row{display:flex;gap:16px;align-items:center}
.dot{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all .2s}
.dot:hover{transform:scale(1.1)}
.dot.on{border-color:#fff;box-shadow:0 0 16px rgba(255,255,255,.3)}

.example-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.example-grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:all .2s;opacity:.7;max-height:120px}
.example-grid img:hover{border-color:var(--accent);opacity:1;transform:scale(1.03)}

.gen-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--accent),#c0392b);color:#fff;border:none;border-radius:28px;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:2px;transition:all .3s;position:relative;overflow:hidden}
.gen-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(233,69,96,.4)}
.gen-btn:disabled{background:#333;cursor:not-allowed;transform:none;box-shadow:none}
.gen-btn::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent,rgba(255,255,255,.1),transparent);transform:rotate(45deg);animation:shimmer 3s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)rotate(45deg)}100%{transform:translateX(100%)rotate(45deg)}}

.result-gallery{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.result-gallery .item{text-align:center;background:var(--card2);border-radius:var(--radius);padding:8px;max-width:200px}
.result-gallery .item .label{font-size:11px;color:var(--text2);margin-bottom:4px}
.result-gallery img{width:100%;max-width:180px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.3)}

.compare-strip{display:flex;gap:12px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.compare-strip .item{text-align:center;max-width:220px}
.compare-strip .item .label{font-size:11px;color:var(--text2);margin-bottom:4px}
.compare-strip img{width:100%;max-width:200px;border-radius:6px}

.toggle-row{display:flex;gap:12px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);cursor:pointer;padding:8px 14px;background:var(--card2);border-radius:20px;border:1px solid transparent;transition:all .2s;user-select:none}
.toggle.on{color:var(--accent);border-color:var(--accent);background:rgba(233,69,96,.12)}
.toggle-box{display:inline-block;width:18px;height:18px;border-radius:4px;border:2px solid var(--text2);transition:all .2s;position:relative}
.toggle.on .toggle-box{border-color:var(--accent);background:var(--accent)}
.toggle.on .toggle-box::after{content:'\2713';position:absolute;top:-1px;left:2px;font-size:12px;color:#fff}

.loading{display:none;text-align:center;padding:24px}
.loading.show{display:block}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none}
</style>
</head>
<body>

<div class="bg-particles"><span></span><span></span><span></span></div>

<div class="header">
  <h1>AI一照成证</h1>
  <p>智能证件照 · 一键生成 · 隐私保护</p>
</div>

<div class="container">

  <div class="control-row">
    <div class="col">
      <div class="card">
        <div class="card-title">示例照片</div>
        <div class="example-grid" id="examples"></div>
      </div>
      <div class="card">
        <div class="card-title">规格</div>
        <select id="specSelect"></select>
      </div>
      <div class="card">
        <div class="card-title">增强选项</div>
        <div class="toggle-row">
          <label class="toggle" onclick="toggleOption(this,'beauty')"><span class="toggle-box"></span> 智能美颜</label>
          <label class="toggle" onclick="toggleOption(this,'gradient')"><span class="toggle-box"></span> 渐变背景</label>
          <label class="toggle on" onclick="toggleOption(this,'allColor')"><span class="toggle-box"></span> 三色同出</label>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <div class="card-title">上传照片</div>
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
          <div class="upload-icon" id="uploadIcon">+</div>
          <div class="upload-text" id="uploadText">点击上传或拖拽</div>
          <img id="preview" class="hidden">
        </div>
        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFile(event)">
      </div>
      <div class="card" id="colorCard">
        <div class="card-title">背景颜色</div>
        <div class="dot-row">
          <div class="dot on" style="background:#fff" data-color="white" onclick="selColor('white',this)"></div>
          <div class="dot" style="background:#638cce" data-color="blue" onclick="selColor('blue',this)"></div>
          <div class="dot" style="background:#ce3535" data-color="red" onclick="selColor('red',this)"></div>
        </div>
      </div>
      <button class="gen-btn" id="genBtn" disabled onclick="generate()">一键生成证件照</button>
      <div class="loading" id="loading"><div class="spinner"></div><p>AI处理中...</p></div>
    </div>
  </div>

  <div class="card" style="text-align:center;display:none" id="resultCard">
    <div class="card-title">生成结果</div>
    <div class="result-gallery" id="allResults"></div>
    <div id="checksBar" style="display:none;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;margin-top:12px;padding:8px;background:var(--card2);border-radius:8px"></div>
  </div>

</div>

<script>
var API='http://localhost:8000';
var spec='一寸',color='white',beauty=false,gradient=false,allColor=true,file=null,imgData=null,origImg=null;

function toggleOption(el,key){
  el.classList.toggle('on');
  if(key==='beauty') beauty=el.classList.contains('on');
  if(key==='gradient') gradient=el.classList.contains('on');
  if(key==='allColor'){allColor=el.classList.contains('on');document.getElementById('colorCard').style.display=allColor?'none':'block'}
}

fetch(API+'/api/examples').then(r=>r.json()).then(d=>{
  d.examples.forEach(function(ex){
    var el=document.createElement('img');el.src=ex.thumbnail;el.title=ex.name;
    el.onclick=function(){file=null;imgData=ex.thumbnail;setPreview(ex.thumbnail);document.getElementById('genBtn').disabled=false};
    document.getElementById('examples').appendChild(el);
  });
});

fetch(API+'/api/specs').then(r=>r.json()).then(d=>{
  var sel=document.getElementById('specSelect');
  d.specs.forEach(function(s,i){
    var o=document.createElement('option');o.value=s.id;o.textContent=s.label;if(i===0)o.selected=true;sel.appendChild(o);
  });
});

function selColor(c,el){color=c;document.querySelectorAll('.dot').forEach(function(d){d.classList.remove('on')});el.classList.add('on')}

function setPreview(src){
  origImg=src;
  document.getElementById('preview').src=src;document.getElementById('preview').classList.remove('hidden');
  document.getElementById('uploadIcon').style.display='none';document.getElementById('uploadText').style.display='none';
  document.getElementById('uploadZone').classList.add('has');
}

function handleFile(e){
  var f=e.target.files[0];if(!f)return;file=f;
  var r=new FileReader();r.onload=function(ev){imgData=ev.target.result;setPreview(ev.target.result);document.getElementById('genBtn').disabled=false};r.readAsDataURL(f);
}

async function processOne(imgSrc,specName,colorName,bgMode){
  var fd=new FormData();
  if(file){fd.append('image',file)}
  else{var b=await fetch(imgSrc);fd.append('image',await b.blob(),'photo.jpg')}
  fd.append('spec',specName);fd.append('color',colorName);fd.append('bg_mode',bgMode);
  fd.append('beauty',beauty?'15':'0');fd.append('brightness',beauty?'3':'0');
  var r=await fetch(API+'/api/process',{method:'POST',body:fd});
  return r.json();
}

async function generate(){
  if(!imgData){alert('请先选择照片');return}
  var btn=document.getElementById('genBtn'),loading=document.getElementById('loading');
  btn.disabled=true;loading.classList.add('show');
  var colors=allColor?['white','blue','red']:[color];
  var mode=gradient?'updown_gradient':'pure_color';
  var t0=Date.now(),results=[],errors=[];

  try{
    for(var i=0;i<colors.length;i++){
      try{
        var d=await processOne(imgData,spec,colors[i],mode);
        if(d.status==='ok')results.push({color:colors[i],img:d.image,spec:d.spec,checks:d.checks});
        else errors.push(d.detail||d.error||'未知错误');
      }catch(e){errors.push(e.message)}
    }
  }finally{
    btn.disabled=false;loading.classList.remove('show');
  }

  if(results.length===0){
    alert('生成失败: '+(errors[0]||'请检查照片是否包含清晰的人脸'));
    document.getElementById('resultCard').style.display='none';
    return;
  }

  var html='';
  if(origImg)html+='<div class="item"><div class="label">原图</div><img src="'+origImg+'"></div>';
  results.forEach(function(r){
    var label={white:'白底',blue:'蓝底',red:'红底'}[r.color];
    html+='<div class="item"><div class="label">'+label+' '+r.spec.width+'x'+r.spec.height+'</div><img src="'+r.img+'"></div>';
  });
  document.getElementById('allResults').innerHTML=html;
  document.getElementById('resultCard').style.display='block';

  var checks=results[0]&&results[0].checks?results[0].checks:null;
  if(checks){
    var ch='';
    checks.checks.forEach(function(c){ch+='<span style="margin:0 4px;font-size:12px">'+c.icon+' '+c.name+'</span>'});
    ch+=' <span style="margin-left:6px;font-size:12px;color:'+(checks.is_good?'#4caf50':'#ff9800')+'">'+(checks.is_good?'✔ 良好':'⚠ '+checks.warn+'建议')+'</span>';
    document.getElementById('checksBar').innerHTML=ch;document.getElementById('checksBar').style.display='flex';
  }
}
</script>
</body>
</html>
